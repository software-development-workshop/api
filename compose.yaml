services:
  accounts-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: accounts
      POSTGRES_PASSWORD: accounts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounts"]
      interval: 2s
      retries: 15
    ports:
      - "5433:5432"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web inbox, to read the verification email while developing

  accounts:
    build: ./services/accounts
    environment:
      DB_HOST: accounts-db
      DB_PORT: 5432
      DB_NAME: accounts
      DB_USER: accounts
      DB_PASSWORD: accounts
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@udesa-x.dev
      PUBLIC_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      accounts-db:
        condition: service_healthy
      mailpit:
        condition: service_started
