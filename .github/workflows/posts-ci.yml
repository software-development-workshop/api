name: posts

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: services/posts

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest tests/unit --cov=src --cov-report=term-missing --cov-fail-under=85

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: posts
          POSTGRES_USER: posts
          POSTGRES_PASSWORD: posts
        options: >-
          --health-cmd "pg_isready -U posts"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
        ports:
          - 5432:5432

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: posts
      DB_USER: posts
      DB_PASSWORD: posts
      ACCOUNTS_BASE_URL: http://accounts:8000
      ACCOUNTS_TIMEOUT_SECONDS: "2"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Integration tests
        run: uv run pytest tests/integration
