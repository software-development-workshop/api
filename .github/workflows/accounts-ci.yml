name: accounts

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: services/accounts

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest tests/unit --cov=src --cov-report=term-missing --cov-fail-under=85
