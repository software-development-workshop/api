name: accounts

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: services/accounts

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest tests/unit --cov=src --cov-report=term-missing --cov-fail-under=85

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: accounts
          POSTGRES_USER: accounts
          POSTGRES_PASSWORD: accounts
        options: >-
          --health-cmd "pg_isready -U accounts"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
        ports:
          - 5432:5432

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: accounts
      DB_USER: accounts
      DB_PASSWORD: accounts
      # Required by Settings, unused by the tests: they run against FakeMailer.
      RESEND_API_KEY: not-a-real-key
      MAIL_FROM: no-reply@udesax.app
      PUBLIC_BASE_URL: http://localhost:8000
      JWT_SECRET: integration-test-jwt-secret-32-bytes-minimum

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Integration tests
        run: uv run pytest tests/integration
