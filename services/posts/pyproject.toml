[project]
name = "udesa-x-posts"
version = "0.1.0"
description = "Posts service: authenticated short-message publishing"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "nh3>=0.3.7",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posts"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "RUF", "S", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["posts", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
